name: frames
on:
  workflow_dispatch:
    inputs:
      items:
        description: '[{"id": "...", "url": "..."}] の JSON（URL は実行ごとに渡し、repo には残さない）'
        required: true
      tag:
        description: 結果の名前
        required: true
        default: run
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4（2026-10-29 時点の版に固定）
        with:
          persist-credentials: false
      - name: 道具を入れる
        run: |
          pip install -q pillow numpy yt-dlp imageio-ffmpeg
      - name: コマ一覧を作る
        env:
          ITEMS: ${{ inputs.items }}
        run: |
          printf '%s' "$ITEMS" > items.json
          python runner.py items.json out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4（2026-10-29 時点の版に固定）
        with:
          name: ${{ inputs.tag }}
          path: out/
          retention-days: 1
